<script>
  document.addEventListener('DOMContentLoaded', function () {
    const toggle = document.querySelector('.dropdownmenu');
    const dropdown = document.querySelector('.dropdowncontent');

    if (toggle && dropdown) {
      toggle.addEventListener('click', function (e) {
        e.stopPropagation();
        dropdown.classList.toggle('open');
      });

      document.addEventListener('click', function () {
        dropdown.classList.remove('open');
      });
    }

    const hamburger = document.querySelector('.hamburger');
    const handynav = document.querySelector('.handynav');

    if (hamburger && handynav) {
      hamburger.addEventListener('click', function () {
        handynav.classList.toggle('active');
      });
    }

    const navTop = document.querySelector('.navtop');
    if (navTop) {
      window.addEventListener('scroll', function () {
        if (window.scrollY > 1) {
          navTop.style.height = '0px';
        } else {
          navTop.style.height = '40px';
        }
      });
    }
  });
</script>

</html>
