<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="kontakt-section">
    
    <div class="kontakt-wrapper">

    <!-- Linke Spalte: Kontaktinformationen -->
    <div class="kontakt-info">

        <!-- Telefon -->

 <f:for each="{children_1499}" as="record">
                
                        <f:format.html>{record.bodytext}</f:format.html>

                
            </f:for>
            
        <div class="kontakt-item">
            <f:for each="{children_1500}" as="record">
                <div class="kontakt-item__content">

                    <div class="kontakt-item__icon">
                        <i class="fas fa-phone-alt"></i>
                    </div>

                    <div class="kontakt-item__text">
                        <f:format.html>{record.bodytext}</f:format.html>
                    </div>

                </div>
            </f:for>
        </div>


        <!-- E-Mail -->
        <div class="kontakt-item">
            <f:for each="{children_1501}" as="record">
                <div class="kontakt-item__content">

                    <div class="kontakt-item__icon">
                        <i class="fas fa-envelope"></i>
                    </div>

                    <div class="kontakt-item__text">
                        <f:format.html>{record.bodytext}</f:format.html>
                    </div>

                </div>
            </f:for>
        </div>


        <!-- Adresse -->
        <div class="kontakt-item">
            <f:for each="{children_1502}" as="record">
                <div class="kontakt-item__content">

                    <div class="kontakt-item__icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>

                    <div class="kontakt-item__text">
                        <f:format.html>{record.bodytext}</f:format.html>
                    </div>

                </div>
            </f:for>
        </div>

    </div>


    <!-- Rechte Spalte: Kontaktformular -->
    <div class="kontakt-form">

        <iframe
            src="https://tally.so/embed/n9Yly5?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
            loading="lazy"
            width="100%"
            height="790"
            frameborder="0"
            marginheight="0"
            marginwidth="0"
            title="Kontakt">
        </iframe>

    </div>

</div>

</div>

</html>
