<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="job-card">
    <div class="job-card__top">
        <button class="job-toggle" type="button" aria-expanded="false">
            <div class="job-toggle__title">
                <!-- Badge und Titel aus colPos 1300 -->
                <f:for each="{children_1300}" as="record">
                    <f:format.html>{record.bodytext}</f:format.html>
                </f:for>
            </div>
            <span class="job-toggle__icon"><i class="fa-solid fa-chevron-down"></i></span>
        </button>
    </div>

    <!-- Ort und Datum aus colPos 1301 & 1302 -->
    <div class="job-card__meta">
        <f:for each="{children_1301}" as="record">
            <span><i class="fas fa-map-marker-alt"></i><f:format.html>{record.bodytext}</f:format.html></span>
        </f:for>
        <f:for each="{children_1302}" as="record">
            <span><i class="fas fa-clock"></i><f:format.html>{record.bodytext}</f:format.html></span>
        </f:for>
    </div>

    <!-- Aufgaben und Anforderungen aus colPos 1303 & 1304 -->
    <div class="job-card__details">
        <div class="job-card__content">
            <f:for each="{children_1303}" as="record">
                <div>
                    <f:format.html>{record.bodytext}</f:format.html>
                </div>
            </f:for>
            <f:for each="{children_1304}" as="record">
                <div>
                    <f:format.html>{record.bodytext}</f:format.html>
                </div>
            </f:for>
        </div>

        <!-- Bewerbungslink aus colPos 1305 -->
        <f:for each="{children_1305}" as="record">
            <f:format.html>{record.bodytext}</f:format.html>
        </f:for>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const jobCards = document.querySelectorAll('.job-card');
    
    jobCards.forEach(card => {
        const toggle = card.querySelector('.job-toggle');
        if (toggle) {
            toggle.addEventListener('click', function(e) {
                e.preventDefault();
                card.classList.toggle('active');
                this.setAttribute('aria-expanded', card.classList.contains('active'));
            });
        }
    });
});
</script>

</html>
