<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="kontakt-section">
    
    <div class="kontakt-wrapper">

    <!-- Linke Spalte: Kontaktinformationen -->
    <div class="kontakt-info">

        <!-- Telefon -->

 <f:for each="{children_1600}" as="record">
                
                        <f:format.html>{record.bodytext}</f:format.html>

                
            </f:for>
            
        <div class="kontakt-item">
            <f:for each="{children_1601}" as="record">
                <div class="kontakt-item__content">

                    <div class="kontakt-item__icon">
                        <i class="fas fa-phone-alt"></i>
                    </div>

                    <div class="kontakt-item__text">
                        <f:format.html>{record.bodytext}</f:format.html>
                    </div>

                </div>
            </f:for>
        </div>


        <!-- E-Mail -->
        <div class="kontakt-item">
            <f:for each="{children_1602}" as="record">
                <div class="kontakt-item__content">

                    <div class="kontakt-item__icon">
                        <i class="fas fa-envelope"></i>
                    </div>

                    <div class="kontakt-item__text">
                        <f:format.html>{record.bodytext}</f:format.html>
                    </div>

                </div>
            </f:for>
        </div>


        <!-- Adresse -->
        <div class="kontakt-item">
            <f:for each="{children_1603}" as="record">
                <div class="kontakt-item__content">

                    <div class="kontakt-item__icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>

                    <div class="kontakt-item__text">
                        <f:format.html>{record.bodytext}</f:format.html>
                    </div>

                </div>
            </f:for>
        </div>

    </div>


    <!-- Rechte Spalte: Kontaktformular -->
    <div class="kontakt-form">

        <div class="formular_erfolg_haken">
      <i class="fa-solid fa-check"></i>
</div>
<p style="font-size: 24px; font-weight: bold;">Das Formular wurde erfolgreich übermittelt.</p>
         
<p>Wir werden uns in Kürze bei Ihnen melden!</p>
    </div>

</div>

</div>

</html>
